<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienestar | Ummana</title>
<script>document.documentElement.classList.add('js');</script>
<meta name="theme-color" content="#262624">
<link rel="preload" as="image" href="../images/salonmovil.webp" media="(max-width:680px)" fetchpriority="high">
<link rel="preload" as="image" href="../images/salon.webp" media="(min-width:681px)" fetchpriority="high">
<meta name="description" content="Yoga, meditación y tai chi en Ummana. Reservá tu clase de prueba sin cargo.">
<link rel="icon" href="../images/logobeige.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2b28;
    --ink-soft:#5c5c56;
    --sand:#b9b8a5;
    --sand-deep:#9a9985;
    --paper:#ffffff;
    --cream:#f3eeea;
    --hairline:rgba(43,43,40,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;overscroll-behavior-y:none;}

  body{
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
    background:var(--paper);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}

  /* ---------- HEADER ---------- */

  header{
    position:fixed;
    top:0;left:0;right:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 48px;
    transition:padding .4s ease, background .4s ease;
    /* lo mantiene pegado arriba aunque el navegador del celular achique o agrande su barra */
    transform:translate3d(0,0,0);
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
  }

  header.scrolled{
    padding:14px 48px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    box-shadow:0 1px 0 var(--hairline);
  }

  .logo-wrap{
    position:relative;
    display:block;
    height:36px;
    transition:height .4s ease;
  }

  .logo-img{
    height:100%;
    width:auto;
    display:block;
    transition:opacity .4s ease;
  }

  .logo-img.logo-beige{
    position:absolute;
    top:0;left:0;
    opacity:0;
  }

  header.scrolled .logo-wrap{height:30px;}
  header.scrolled .logo-img.logo-white{opacity:0;}
  header.scrolled .logo-img.logo-beige{opacity:1;}

  .back-link{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.14em;
    font-weight:500;
    color:var(--paper);
    border:1px solid rgba(255,255,255,0.55);
    padding:9px 20px 9px 16px;
    border-radius:2px;
    transition:all .35s ease;
  }

  .back-link svg{width:13px;height:13px;display:block;}

  header.scrolled .back-link{
    color:var(--ink);
    border-color:var(--ink);
  }

  .back-link:hover{
    background:var(--paper);
    color:var(--ink);
  }

  header.scrolled .back-link:hover{
    background:var(--ink);
    color:var(--paper);
  }

  /* ---------- HERO ---------- */

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    min-height:560px;
    background:#cfcfc9;
    overflow:hidden;
  }

  .hero-media{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;

    object-position:50% 100%;  /* en PC se prioriza el piso: el mat se ve entero */
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.38) 100%),
      rgba(58,48,38,0.34);
    pointer-events:none;
  }

  .hero-words{
    position:absolute;
    z-index:2;
    left:0;right:0;
    bottom:clamp(36px, 9vh, 84px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(16px, 3vw, 34px);
    padding:0 20px;
    color:var(--paper);
    text-shadow:0 2px 16px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.35);
  }

  .hero-word{
    font-size:clamp(15px, 2vw, 21px);
    font-weight:400;
    letter-spacing:0.14em;
    white-space:nowrap;
    padding:8px 2px;
    animation:wordFloat 4.2s ease-in-out infinite;
    transition:opacity .25s ease;
  }

  .hero-word:nth-of-type(2){animation-delay:.7s;}
  .hero-word:nth-of-type(3){animation-delay:1.4s;}

  .hero-word:hover{opacity:0.7;}

  .hero-bar{
    width:1px;
    height:clamp(16px, 2.2vw, 22px);
    background:rgba(255,255,255,0.7);
    flex:0 0 auto;
  }

  @keyframes wordFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }

  /* ---------- BLOQUES (franjas a todo el ancho) ---------- */

  .band{
    width:100%;
    padding:38px 0 34px;
    scroll-margin-top:61px;
  }

  .band.beige{background:var(--cream);}
  .band.white{background:var(--paper);}

  .band-inner{
    max-width:1128px;
    margin:0 auto;
    padding:0 24px;
  }

  .band-title{
    font-size:clamp(26px, 3.2vw, 34px);
    font-weight:500;
    letter-spacing:0.04em;
    color:var(--ink);
    position:relative;
    display:inline-block;
    padding-bottom:12px;
    margin-bottom:12px;
  }

  .band-title::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:44px;
    height:2px;
    background:var(--sand);
  }

  .band-intro{
    font-size:15px;
    line-height:1.8;
    color:var(--ink-soft);
  }

  .styles{
    display:flex;
    flex-direction:column;
    gap:40px;
    margin-top:34px;
  }

  .style-label{
    display:block;
    font-size:10.5px;
    letter-spacing:0.18em;
    font-weight:700;
    color:var(--sand-deep);
    margin-bottom:8px;
  }

  .styles-title{
    margin-top:28px;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }

  .styles-arrow{
    width:18px;
    height:18px;
    color:var(--sand-deep);
    animation:arrowNudge 2.6s ease-in-out infinite;
  }

  @keyframes arrowNudge{
    0%,100%{transform:translateY(-2px);opacity:.55;}
    50%{transform:translateY(3px);opacity:1;}
  }

  .band.multi .styles{margin-top:30px;}

  .style-row{
    display:flex;
    align-items:center;
    gap:56px;
  }

  .style-row.reverse{flex-direction:row-reverse;}

  .style-photo{
    position:relative;
    flex:0 0 46%;
    aspect-ratio:4/3;
    border-radius:6px;
    overflow:hidden;
    background:#e7e6df;
    box-shadow:0 14px 34px rgba(43,43,40,0.14);
  }

  .style-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .6s ease;
  }

  .style-photo:hover img{transform:scale(1.05);}

  .photo-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7e6df;
    color:#9a9985;
    font-size:11px;
    letter-spacing:0.16em;
    font-weight:600;
  }

  .style-text{flex:1 1 auto;}

  .style-text h3{
    font-size:21px;
    font-weight:700;
    color:var(--ink);
    position:relative;
    display:inline-block;
    padding-bottom:12px;
    margin-bottom:6px;
  }

  .style-text h3::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:34px;
    height:2px;
    background:var(--sand);
  }

  .style-text p{
    margin-top:12px;
    font-size:14px;
    line-height:1.8;
    color:var(--ink-soft);
  }

  .band-foot{margin-top:34px;margin-bottom:28px;}

  .marquee-wrap{
    overflow:hidden;
    padding:4px 0;
  }

  .marquee-track{
    display:flex;
    gap:12px;
    width:max-content;
    animation:marquee 26s linear infinite;
  }

  .marquee-wrap:hover .marquee-track{animation-play-state:paused;}

  @keyframes marquee{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  .chip{
    flex:0 0 auto;
    font-size:11.5px;
    letter-spacing:0.02em;
    color:var(--ink);
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(43,43,40,0.14);
    padding:8px 16px;
    border-radius:20px;
    white-space:nowrap;
  }

  /* franja oscura del llamado a la acción */
  .styles + .cta-strip,.slider-wrap + .cta-strip{margin-top:34px;}

  .cta-strip{
    background:rgba(185,184,165,0.26);
    border-radius:16px;
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .cta-strip-text{
    font-size:14px;
    line-height:1.5;
    letter-spacing:0.01em;
    color:var(--ink);
  }

  .cta-strip-text strong{font-weight:600;}

  .btn-strip{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.08em;
    font-weight:600;
    color:#fff;
    background:var(--ink);
    padding:8px 22px;
    border-radius:20px;
    transition:background .25s ease;
  }

  .btn-strip:hover{background:var(--sand-deep);}

  /* ---------- WHATSAPP FLOAT ---------- */

  .whatsapp-float{
    position:fixed;
    bottom:28px;
    right:28px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#4FBE82;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    z-index:200;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .whatsapp-float:hover{
    transform:scale(1.08);
    box-shadow:0 10px 28px rgba(0,0,0,0.28);
  }

  .whatsapp-float svg{
    width:28px;
    height:28px;
    fill:#fff;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width:900px){
    header{padding:20px 24px;}
    header.scrolled{padding:14px 24px;}
    .style-row,
    .style-row.reverse{flex-direction:column;gap:28px;align-items:stretch;}
    .style-photo{flex-basis:auto;width:100%;}
    .styles{gap:52px;}
  }

  /* puntos del deslizador de estilos: junto al título, solo en el celular */
  .slider-wrap{position:relative;}
  .slider-dots{display:none;}

  @media (max-width:680px){
    /* espaciado pensado para el celular */
    .band{scroll-margin-top:58px;padding:36px 0 28px;}
    .band-inner{padding:0 20px;}
    .band-title{font-size:28px;padding-bottom:12px;margin-bottom:14px;}
    .band-intro{font-size:14px;line-height:1.7;}
    .styles{margin-top:26px;}

    /* cada estilo: título, subrayado, foto y después la descripción */
    .style-row,
    .style-row.reverse{gap:0;align-items:stretch;}
    .style-text{display:contents;}
    .style-text h3{order:1;align-self:flex-start;font-size:20px;padding-bottom:11px;margin-bottom:0;}
    .style-photo{order:2;margin-top:14px;box-shadow:0 8px 20px rgba(43,43,40,0.12);}
    .style-text p{order:3;margin-top:16px;font-size:14px;line-height:1.7;}

    /* Meditación y Tai Chi: la foto va arriba del título */
    .band:not(.multi) .style-photo{order:0;margin-top:4px;}
    .band:not(.multi) .style-text h3{margin-top:18px;}

    .marquee-wrap{padding:4px 0;}
    .cta-strip{flex-direction:column;gap:10px;padding:16px 16px 18px;}
    .styles + .cta-strip,.slider-wrap + .cta-strip{margin-top:22px;}
    .cta-strip-text{font-size:13px;text-align:center;}
    .btn-strip{font-size:13px;padding:9px 26px;}

    .whatsapp-float{width:52px;height:52px;bottom:18px;right:16px;}
    .whatsapp-float svg{width:26px;height:26px;}

    /* "Nuestros estilos:" y puntos: indican cuántos estilos hay y cuál se está viendo */
    .styles-title{margin-top:22px;font-size:16px;}
    .band.multi .styles{margin-top:16px;}
    .band.multi .slider-dots{
      display:flex;
      position:absolute;
      top:1px;
      right:-7px;
      z-index:2;
    }
    .slider-dots button{
      width:22px;
      height:22px;
      padding:7px;
      border-radius:50%;
      background-color:rgba(154,153,133,0.4);
      background-clip:content-box;
      transition:background-color .25s ease, transform .25s ease;
    }
    .slider-dots button.active{
      background-color:var(--sand-deep);
      transform:scale(1.25);
    }

    /* la franja de beneficios queda bien pegada al instructor y a la franja oscura */
    .band-foot{margin-top:16px;margin-bottom:16px;}

    /* estilos de Yoga: se ve uno a la vez; al cambiar sale con fundido + deslizamiento y entra el siguiente */
    .band.multi .styles{
      display:block;
      overflow:hidden;
      touch-action:pan-y;
      transition:height .3s ease;
    }
    .band.multi .style-row{
      display:none;
      transition:opacity .4s ease, transform .4s ease;
    }
    .band.multi .style-row.is-active{display:flex;}
    .band.multi .style-row.no-transition{transition:none;}
    .band.multi .style-row.offset-left{opacity:0;transform:translateX(-22px);}
    .band.multi .style-row.offset-right{opacity:0;transform:translateX(22px);}
    .band.multi .style-photo{box-shadow:none;}

    .logo-wrap{height:28px;}
    header.scrolled .logo-wrap{height:26px;}
    /* celular: la persona sube apenas y las palabras bajan, para que queden debajo del mat */
    .hero-words{bottom:82px;}
    .hero-media{top:auto;bottom:0;height:calc(100% + 84px);object-position:28% 100%;}
    .back-link{font-size:10.5px;padding:8px 14px 8px 11px;}
  }

  /* ---------- ANIMACIONES (solo transform y opacity: livianas) ---------- */

  @keyframes heroZoom{
    from{ transform:scale(1.07); }
    to{ transform:scale(1); }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }

  @keyframes waRing{
    0%{ transform:scale(1); opacity:0.55; }
    70%, 100%{ transform:scale(1.65); opacity:0; }
  }

  .hero-media{animation:heroZoom 2.4s cubic-bezier(.2,.7,.2,1) both;}
  .hero-words{animation:fadeUp 1s ease .55s both;}
  header{animation:fadeIn .9s ease both;}

  /* anillo suave en el botón de WhatsApp para llamar la atención */
  .whatsapp-float::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid #4FBE82;
    animation:waRing 3.6s ease-out 2.5s infinite;
    pointer-events:none;
  }

  .btn-strip:active{transform:scale(0.96);}

  /* aparición al hacer scroll */
  .js .reveal{
    opacity:0;
    transform:translateY(22px);
    transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1);
    transition-delay:var(--d, 0s);
  }
  .js .reveal.in{opacity:1;transform:none;}

  .band-title::after{transition:width .9s cubic-bezier(.2,.7,.2,1) .25s;}
  .js .band-title.reveal::after{width:0;}
  .js .band-title.reveal.in::after{width:44px;}

  /* en el celular, los estilos de Yoga se deslizan: no se animan por scroll vertical */
  @media (max-width:680px){
    .js .band.multi .style-row .reveal{opacity:1;transform:none;transition:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .hero-media,.hero-words,header,.whatsapp-float::after,.styles-arrow{animation:none;}
    .js .reveal{opacity:1;transform:none;transition:none;}
    .js .band-title.reveal::after{width:44px;transition:none;}
    .hero-word{animation:none;}
    .marquee-track{animation:none;}
  }
</style>
</head>

<!-- ============================================================
     SEGUIMIENTO DE CONVERSIONES (Google Ads)
     Completar con los datos de la acción de conversión:
       ADS_ID    -> por ejemplo "AW-123456789"
       ADS_LABEL -> por ejemplo "AbC-D_efG-h12"
     Mientras estén vacíos no se carga ningún tag ni se mide nada.
     Todo elemento con la clase "cta-track" cuenta como conversión al hacer clic.
     ============================================================ -->
<script>
  const ADS_ID = "AW-17812520756";
  const ADS_LABEL = "uSMLCPzMuaIdELT-1a1C";
  const WHATSAPP_PHONE = "5491139208108";

  if (ADS_ID){
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ADS_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', ADS_ID);
  }

  function waLink(text){
    return 'https://api.whatsapp.com/send?phone=' + WHATSAPP_PHONE + '&text=' + encodeURIComponent(text);
  }

  // Un único listener para todos los botones de llamado a la acción
  document.addEventListener('click', (e) => {
    const cta = e.target.closest('.cta-track');
    if (!cta) return;
    if (window.gtag && ADS_ID && ADS_LABEL){
      gtag('event', 'conversion', { send_to: ADS_ID + '/' + ADS_LABEL });
    }
  });
</script>

<script>
  /* ---------- HEADER SCROLL STATE ---------- */
  const header = document.getElementById('siteHeader');
  function updateHeader(){ header.classList.toggle('scrolled', window.scrollY > 40); }
  window.addEventListener('scroll', updateHeader, { passive: true });
  updateHeader();

  /* ---------- CONTENIDO (mismo texto que los desplegables del sitio principal) ---------- */
  const CTA_TEXT = 'Si querés reservar tu <strong>clase de prueba sin cargo</strong>';

  const blocksData = [
    {
      id: "yoga",
      bg: "beige",
      title: "Yoga",
      waText: "Hola! Quiero reservar una clase de prueba sin cargo de Yoga",
      intro: "<strong>Conectá con tu cuerpo, tu respiración y tu mente a tu propio ritmo</strong>, en un entorno cuidado, en nuestros distintos estilos y clases, accesibles para todos los niveles, incluso sin experiencia previa.",
      stylesTitle: "Conocé nuestros estilos",
      items: [

          name: "Ashtanga Yoga",
          bio: "Práctica dinámica basada en una serie fija de posturas que se repite en cada clase, coordinando movimiento y respiración. La repetición permite profundizar progresivamente en la práctica y desarrollar fuerza, flexibilidad y concentración. <strong>Con el tiempo, la secuencia puede convertirse en una verdadera meditación en movimiento: intensa, profunda y transformadora.</strong>"
        },
        {
          photo: "../images/suave.webp",
          name: "Yoga Suave",
          bio: "Práctica pensada para quienes buscan moverse desde la calma y la sutileza. Los movimientos se adaptan a las posibilidades de cada persona, favoreciendo una experiencia accesible y consciente. <strong>Es ideal para personas mayores, con movilidad reducida o para quienes desean comenzar a practicar yoga de manera gradual y sin exigencias.</strong>"
        },
        {
          photo: "../images/hatha.webp",
          name: "Hatha Yoga",
          bio: "Práctica que invita a sostener y profundizar las posturas, trabajando especialmente la alineación, la estabilidad y la conciencia corporal, utilizando elementos que pueden facilitar o intensificar la práctica según las necesidades de cada persona. <strong>Ideal para desarrollar fuerza, flexibilidad y presencia de manera progresiva.</strong>"
        }
      ],
      chips: []
    },
    {
      id: "meditacion",
      bg: "white",
      title: "Meditación",
      waText: "Hola! Quiero reservar una clase de prueba sin cargo de Meditación",
      intro: "<strong>Bajá el ritmo, aquietá la mente y volvé a conectar con vos mismo.</strong> La meditación propone momentos de pausa, respiración y atención plena, para cultivar mayor presencia y calma en el día a día.",
      items: [
        {
          photo: "../images/meditacion.webp",
          name: "¿Qué hacemos en cada encuentro?",
          bio: "<strong>Meditación sentada:</strong> Una práctica guiada para aquietar la mente y conectar con el presente.<br><strong>Lectura y reflexión:</strong> Un momento para integrar la enseñanza y abrir el diálogo grupal.<br><strong>Cierre con té grupal:</strong> Un espacio cálido para compartir experiencias, aprendizajes y generar vínculos."
        }
      ],
      chips: []
    },
    {
      id: "tai-chi",
      bg: "beige",
      title: "Tai Chi Chuan",
      waText: "Hola! Quiero reservar una clase de prueba sin cargo de Tai Chi",
      intro: "<strong>Combiná movimientos suaves y fluidos, para conectar cuerpo, mente y respiración.</strong> Más que una práctica física, es un camino que favorece la movilidad, la coordinación y una mayor conciencia corporal.",
      items: [
        {
          photo: "../images/taichi.webp",
          name: "¿Por qué practicar Taichi?",
          bio: "El Taichi conecta cuerpo y mente a través del movimiento, la respiración y la atención plena, ayudándote a encontrar mayor equilibrio, calma y presencia en el día a día. <strong>Es una práctica accesible para todas las edades y niveles</strong>, no requiere experiencia previa y se adapta al ritmo de cada persona, favoreciendo la movilidad, la coordinación y el bienestar integral."
        }
      ],
      chips: []
    }
  ];

  /* ---------- ARMADO DE LAS FRANJAS ---------- */
  const container = document.getElementById('blocks');

  blocksData.forEach((data, i) => {
    const chipsHTML = (data.chips || []).map(t => `<span class="chip">${t}</span>`).join('');

    const multiple = data.items.length > 1;
    const rowsHTML = data.items.map((p, idx) => {
      // las franjas con varios estilos alternan el lado de la foto: izquierda, derecha, izquierda
      const reverse = idx % 2 === 1 ? ' reverse' : '';
      const photoHTML = p.photo
        ? `<img src="${p.photo}" alt="${p.name}" loading="lazy">`
        : `<div class="photo-placeholder">FOTO PROFESIONAL</div>`;
      return `
        <div class="style-row${reverse}">
          <div class="style-photo reveal">${photoHTML}</div>
          <div class="style-text">
            ${data.stylesTitle ? `<span class="style-label reveal">${data.stylesTitle}</span>` : ''}
            <h3 class="reveal" style="--d:.1s">${p.name}</h3>
            <p class="reveal" style="--d:.2s">${p.bio}</p>
          </div>
        </div>`;
    }).join('');

    const section = document.createElement('section');
    section.className = 'band ' + (data.bg === 'white' ? 'white' : 'beige') + (multiple ? ' multi' : '');
    section.id = data.id;
    section.innerHTML = `
      <div class="band-inner">
        <h2 class="band-title reveal">${data.title}</h2>
        <p class="band-intro reveal" style="--d:.1s">${data.intro}</p>
        <div class="styles">${rowsHTML}</div>
        ${data.chips && data.chips.length ? `<div class="band-foot">
          <div class="marquee-wrap reveal"><div class="marquee-track">${chipsHTML}${chipsHTML}</div></div>
        </div>` : ''}
        <div class="cta-strip reveal">
          <p class="cta-strip-text">${CTA_TEXT}</p>
          <a class="btn-strip cta-track" href="${waLink(data.waText)}" target="_blank" rel="noopener">escribinos</a>
        </div>
      </div>
    `;
    container.appendChild(section);

    if (multiple) setupMobileSlider(section);
  });

  /* ---------- DESLIZADOR DE ESTILOS (solo celular) ---------- */
  function setupMobileSlider(section){
    const track = section.querySelector('.styles');
    const rows = [...track.querySelectorAll('.style-row')];
    const mq = window.matchMedia('(max-width:680px)');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    const AUTO_MS = 10000;
    const FADE_MS = 400;
    let index = 0;
    let held = false;       // el dedo está apretando el deslizador
    let visible = false;    // la franja está en pantalla
    let busy = false;       // hay un cambio de estilo en curso
    let timer = null;

    rows[0].classList.add('is-active');

    // el deslizador queda envuelto; los puntos se ubican en la línea del título, a la derecha
    const wrap = document.createElement('div');
    wrap.className = 'slider-wrap';
    track.parentNode.insertBefore(wrap, track);
    wrap.appendChild(track);

    const dots = document.createElement('div');
    dots.className = 'slider-dots';
    dots.innerHTML = rows.map((_, i) => `<button aria-label="Ir al estilo ${i + 1}"></button>`).join('');
    wrap.appendChild(dots);
    const dotBtns = [...dots.querySelectorAll('button')];
    dotBtns.forEach((d, i) => d.addEventListener('click', () => { goTo(i, i > index ? 1 : -1); schedule(); }));
    function paintDots(){ dotBtns.forEach((d, i) => d.classList.toggle('active', i === index)); }

    // la altura sigue al estilo visible, así la franja de beneficios queda pegada al instructor
    function fitHeight(){
      if (!mq.matches){ track.style.height = ''; return; }
      track.style.height = rows[index].offsetHeight + 'px';
    }

    // cambia de estilo: el actual se desvanece deslizándose, y el nuevo entra desde el otro lado
    // direction: 1 = siguiente (entra desde la derecha), -1 = anterior (entra desde la izquierda)
    function goTo(target, direction){
      target = (target + rows.length) % rows.length;
      if (!mq.matches || busy || target === index) return;
      busy = true;
      const old = rows[index];
      const next = rows[target];
      const leaveClass = direction === 1 ? 'offset-left' : 'offset-right';
      const enterClass = direction === 1 ? 'offset-right' : 'offset-left';
      track.style.height = old.offsetHeight + 'px';
      old.classList.add(leaveClass);
      setTimeout(() => {
        old.classList.remove('is-active', leaveClass);
        index = target;
        next.classList.add('no-transition', enterClass, 'is-active');
        paintDots();
        fitHeight();
        // doble rAF: asegura que el navegador pintó el estado "ya corrido hacia el costado"
        // antes de soltar la transición, para que la entrada arranque siempre limpia
        requestAnimationFrame(() => requestAnimationFrame(() => {
          next.classList.remove('no-transition', enterClass);
          busy = false;
        }));
      }, reducedMotion ? 0 : FADE_MS);
    }

    // avance automático: pasa al siguiente cada 10 segundos, salvo que haya un dedo apretando
    function schedule(){
      clearTimeout(timer);
      if (reducedMotion || !mq.matches || !visible || held) return;
      timer = setTimeout(() => {
        if (!held && !document.hidden) goTo(index + 1, 1);
        schedule();
      }, AUTO_MS);
    }

    // deslizar con el dedo: hacia la izquierda pasa al siguiente (y del último vuelve al primero),
    // hacia la derecha vuelve al anterior
    let startX = 0, startY = 0;
    track.addEventListener('touchstart', e => {
      held = true; clearTimeout(timer);
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    }, { passive: true });
    const release = () => { held = false; schedule(); };
    track.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5){
        if (dx < 0) goTo(index + 1, 1); else goTo(index - 1, -1);
      }
      release();
    }, { passive: true });
    track.addEventListener('touchcancel', release, { passive: true });

    new IntersectionObserver(entries => {
      visible = entries[0].isIntersecting;
      schedule();
    }, { threshold: 0.25 }).observe(section);

    const ro = new ResizeObserver(() => { if (!busy) fitHeight(); });
    rows.forEach(r => ro.observe(r));
    mq.addEventListener('change', () => {
      rows.forEach(r => r.classList.remove('offset-left', 'offset-right', 'no-transition'));
      rows.forEach((r, i) => r.classList.toggle('is-active', i === 0));
      index = 0; busy = false; fitHeight(); paintDots(); schedule();
    });
    fitHeight();
    paintDots();
  }

  /* ---------- APARICIÓN AL HACER SCROLL ---------- */
  const revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    revealEls.forEach(el => io.observe(el));
  } else {
    revealEls.forEach(el => el.classList.add('in'));
  }

  /* ---------- BOTÓN FLOTANTE DE WHATSAPP ---------- */
  const waFloat = document.getElementById('whatsappFloat');
  waFloat.href = waLink(waFloat.dataset.waText);
</script>
